<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14161a;
    color: #e8e8ec;
    margin: 0;
    padding: 16px;
  }
  h2 { font-size: 14px; margin: 0 0 12px; }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid #2c2f36;
  }
  .row:last-of-type { border-bottom: none; }
  .label { color: #9a9aa4; }
  .value { font-weight: 600; }
  .value.yes { color: #4ade80; }
  .value.no { color: #f87171; }
  p { font-size: 11px; color: #6f6f79; margin-top: 14px; }
</style>
</head>
<body>
  <h2>You Are Not Reconnected</h2>
  <div class="row"><span class="label">Gate open</span><span id="gate" class="value">…</span></div>
  <div class="row"><span class="label">Solved at least once</span><span id="solved" class="value">…</span></div>
  <div class="row"><span class="label">Lives remaining</span><span id="lives" class="value">…</span></div>
  <p>The gate being closed has no relationship to your actual internet connection. That's the point.</p>
  <script src="popup.js"></script>
</body>
</html>
