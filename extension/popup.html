<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("game/fonts/bebas-neue-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Inter";
    src: url("game/fonts/inter-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("game/fonts/jetbrains-mono-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
  }
  body {
    width: 260px;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background: #121212;
    color: #f4f4f4;
    margin: 0;
    padding: 16px;
  }
  h2 {
    font-family: "Bebas Neue", Inter, sans-serif;
    font-size: 28px;
    line-height: 0.85;
    font-style: italic;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.16);
  }
  .row:last-of-type { border-bottom: none; }
  .label {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.45;
  }
  .value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-style: italic;
  }
  .value.yes { color: #f4f4f4; }
  .value.no { opacity: 0.45; }
  p {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.4;
    margin: 14px 0 0;
  }
</style>
</head>
<body>
  <h2>YOU ARE NOT<br>RECONNECTED</h2>
  <div class="row"><span class="label">Gate</span><span id="gate" class="value">…</span></div>
  <div class="row"><span class="label">Solved</span><span id="solved" class="value">…</span></div>
  <div class="row"><span class="label">Lives</span><span id="lives" class="value">…</span></div>
  <div class="row"><span class="label">Vibe</span><span id="vibe" class="value">…</span></div>
  <p>The gate being closed has no relationship to your actual internet connection. The soundtrack does not open the gate either.</p>
  <script src="popup.js"></script>
</body>
</html>
