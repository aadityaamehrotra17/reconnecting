<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You Are Not Reconnected — Clear the Board</title>
<link rel="stylesheet" href="minesweeper.css" />
</head>
<body>
  <div id="app" class="app">
    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

    <div class="shell">
      <header class="masthead">
        <h1>YOU ARE NOT<br />RECONNECTED</h1>
        <div class="masthead-meta">
          <button type="button" id="lights-toggle" class="lights-toggle">
            <span id="lights-swatch" class="lights-swatch"></span>
            <span id="lights-label">Lights On</span>
          </button>
        </div>
      </header>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Connection</span>
          <span id="real-status" class="stat-value unknown">checking...</span>
        </div>
        <div class="stat">
          <span class="stat-label">Mines Left</span>
          <span id="mines-left" class="stat-value">010</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time Left</span>
          <span id="time-left" class="stat-value">045</span>
        </div>
        <div class="stat">
          <span class="stat-label">Verdict</span>
          <span id="verdict-status" class="stat-value denied">NOPE</span>
        </div>
        <div class="stat stat-lives">
          <span class="stat-label">Lives</span>
          <span id="lives" class="stat-value lives-glyphs">◆◆◆</span>
        </div>
      </div>

      <section id="vibe-console" class="vibe-console" aria-label="Soundtrack vibe">
        <div class="vibe-row">
          <div class="vibe-switch" data-vibe-switch role="radiogroup" aria-label="Choose a soundtrack vibe">
            <button type="button" role="radio" data-vibe="rock" class="vibe-option" title="Stepz — Rock (Instrumental)">Rock</button>
            <button type="button" role="radio" data-vibe="doom" class="vibe-option" title="Mick Gordon — BFG Division">Doom</button>
            <button type="button" role="radio" data-vibe="lofi" class="vibe-option" title="3 Minute Spring Timer">Lofi</button>
          </div>
          <div class="sync-track" aria-hidden="true">
            <div id="sync-fill" class="sync-fill"></div>
          </div>
          <span id="sync-label" class="sync-label">0% SYNC</span>
        </div>
        <p data-vibe-now-playing class="vibe-now-playing">Soundtrack armed. Click anywhere to authorize the vibe.</p>
        <p data-vibe-lease class="vibe-lease">acquiring lease…</p>
      </section>

      <div class="board-wrap">
        <div id="board-frame" class="board-frame">
          <div id="board" class="board"></div>
        </div>
      </div>

      <div class="footer-row">
        <button type="button" id="reset-drop" class="reset-drop">Reset Drop</button>
      </div>
    </div>
  </div>

  <div id="end-overlay" class="end-overlay hidden">
    <div class="end-card">
      <span id="end-kicker" class="end-kicker">Drop Fumbled</span>
      <p id="end-title" class="end-title">CONNECTION<br />TERMINATED</p>
      <p id="end-copy" class="end-copy">The router is disappointed. It will remember this.</p>
      <div id="lockout-phase" class="lockout-phase hidden">
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="popup-detail" class="popup-detail">0 of 4,281 items removed</div>
      </div>
      <button type="button" id="end-action" class="reset-drop hidden">Run It Back</button>
    </div>
  </div>

  <script type="module" src="minesweeper.js"></script>
</body>
</html>
